services:
  postgres:
    image: postgres:16-alpine
    container_name: fantasy-trade-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fantasytrade
      POSTGRES_PASSWORD: fantasytrade
      POSTGRES_DB: fantasytrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasytrade -d fantasytrade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
